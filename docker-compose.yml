services:
  gastos:
    build: .
    image: gastos-gate-towers:latest
    container_name: gastos-gate-towers
    restart: unless-stopped
    ports:
      # Escucha solo en la IP de Tailscale del host (o 127.0.0.1 con tailscale serve), definida en .env.
      # Es obligatoria: sin ella el puerto quedaría abierto a toda la LAN, con la contraseña viajando en claro.
      - "${BIND_ADDR:?Define BIND_ADDR en .env con la IP de Tailscale del host}:${HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/data            # base de datos y archivos (haz respaldo de esta carpeta)
      - ./seed:/app/seed:ro     # datos iniciales; solo se cargan si la base está vacía
    environment:
      - TZ=Asia/Dubai
      # Avisos de vencimiento por ntfy (opcional): se activan si defines NTFY_URL y NTFY_TOPIC en .env.
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - NTFY_CLICK=${NTFY_CLICK:-}
